name: Publish

on:
  workflow_call:

jobs:
  run:
    name: Publish

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: ✅ Checkout Repository ✅
        uses: actions/checkout@v4

      - name: install
        run: cargo toolchain install

      - name: Get Release Tag
        id: release_tag
        run: |
          tag_name="${{ github.event.release.tag_name }}"

          # remove the leading 'v' if it exists
          release_tag="${tag_name#v}"

          echo "Release Tag: $release_tag"
          echo "tag=$release_tag" >> $GITHUB_OUTPUT
        shell: bash
        if: github.event.release != null

      - name: Checkout New Branch
        run: |
          git checkout -b "github-actions/release-${{ steps.release_tag.outputs.tag }}"
      
      - name: Push New Branch
        run: |
          git push origin "github-actions/release-${{ steps.release_tag.outputs.tag }}"
        if: github.event.release != null

      - name: Login to Registry
        run: cargo login "${{ secrets.CRATES_IO_TOKEN }}" --registry UefiRust

      - name: Cargo Release Dry Run
        run: cargo release ${{ steps.release_tag.outputs.tag }} --no-tag --workspace --registry UefiRust
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Cargo Release
        run: echo 'we run'
        if: github.event.release != null
        env:
          RUSTC_BOOTSTRAP: 1



      # TODO: Add ability for a github app to create a release from the published branch
